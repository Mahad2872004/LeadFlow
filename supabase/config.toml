project_id = "leadflow"

[functions.submit-inquiry]
verify_jwt = false

[functions.retry-notifications]
verify_jwt = false

[functions.inbound-lead]
verify_jwt = false

[functions.client-portal]
verify_jwt = false

[functions.onboarding-reminders]
verify_jwt = false

[functions.discover-leads]
# The handler verifies the caller by passing their token to the database; gateway JWT checks would
# also reject the browser's unauthenticated CORS preflight.
verify_jwt = false

[functions.apollo]
# Callers are checked by passing their token to the database (apollo_member_role).
verify_jwt = false

[functions.apollo-webhook]
# Apollo calls this without a Supabase token; a per-reveal random token in the URL authorizes each delivery.
verify_jwt = false

[functions.business-analysis]
# Callers are checked by passing their token to the database (analysis_member_role).
verify_jwt = false

[functions.analysis-worker]
# Called by Supabase Cron with the x-worker-secret header.
verify_jwt = false

[functions.outreach]
# Callers are checked by passing their token to the database (analysis_member_role).
verify_jwt = false

[functions.client-files]
# Callers are checked by passing their token to the database (analysis_member_role and the document functions).
verify_jwt = false

[functions.project-assistant]
# Callers are checked by passing their token to the database (analysis_member_role and project_ai_context).
verify_jwt = false

[functions.client-hub]
# Invitation actions carry only an invitation token (hashed and checked by the database); file actions pass the
# client's own token to the hub_ database functions. Gateway JWT checks would also reject the CORS preflight.
verify_jwt = false

[functions.portal-notifications]
# A scheduler calls this with the shared worker secret (x-worker-secret), not a Supabase token.
verify_jwt = false

[functions.automation]
# Callers are checked by passing their token to the database (automation_center_for and the other automation functions).
verify_jwt = false

[functions.automation-worker]
# A scheduler calls this with the shared worker secret (x-worker-secret), not a Supabase token.
verify_jwt = false

[functions.automation-webhook]
# External systems sign each request with the endpoint's HMAC key; there is no Supabase token.
verify_jwt = false
